<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallCraft</title>
    <script>
      // Keep the marketing page light from the first paint (no dark flash before the app loads).
      try {
        if (localStorage.getItem('callcraft.signedIn') !== '1') document.documentElement.dataset.theme = 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
